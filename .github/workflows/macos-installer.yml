name: macOS Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install natID SDK
        run: |
          git clone --depth 1 https://github.com/idzafic/natID.git $HOME/natID
          # The project's CMakeLists expects $HOME/natID.SDK and $HOME/natID.Utils
          ln -s $HOME/natID/natID.SDK $HOME/natID.SDK
          ln -s $HOME/natID/natID.Utils $HOME/natID.Utils
          # The repo does not ship prebuilt libs - download them from Releases
          # (per natID.SDK/bin/ReadMe.txt: extract bin_<platform> archive into bin/)
          brew install sevenzip
          curl -L -o /tmp/sdk-bin.7z \
            https://github.com/idzafic/natID/releases/download/v4.2.1/bin_macOS_arm64_20260710.7z
          7zz x -y -o$HOME/natID.SDK/bin /tmp/sdk-bin.7z
          ls -la $HOME/natID.SDK/bin/lib/

      - name: Place project where the collector config expects it
        run: |
          mkdir -p ~/Desktop
          ln -s "$GITHUB_WORKSPACE" ~/Desktop/GameOfTheAmazons

      - name: Configure and build (Release)
        run: |
          cmake -S . -B $HOME/natID.RAMDisk/build -DCMAKE_BUILD_TYPE=Release
          cmake --build $HOME/natID.RAMDisk/build -j

      - name: Verify executable exists
        run: |
          ls -la $HOME/natID.RAMDisk/Out/AmazonsGame/Release/
          test -f $HOME/natID.RAMDisk/Out/AmazonsGame/Release/AmazonsGame.app/Contents/MacOS/AmazonsGame

      - name: Collect installer (SetupCollector)
        run: |
          # EnvVariables.xml maps $RAMDisk to /Volumes/RAMDisk on macOS,
          # but we built into $HOME/natID.RAMDisk - bridge the two
          sudo ln -s $HOME/natID.RAMDisk /Volumes/RAMDisk
          # SetupCollector needs EnvVariables.xml + Packages/ next to the config:
          # assemble a working dir from the SDK's SetupCollectors + our config
          cp -r $HOME/natID/natID.SDK/DevEnv/SetupCollectors $HOME/Setups
          cp ${{ github.workspace }}/packaging/AmazonsGame.xml $HOME/Setups/
          chmod +x $HOME/natID/natID.Utils/macOS/arm64/SetupCollector
          $HOME/natID/natID.Utils/macOS/arm64/SetupCollector \
            $HOME/Setups/AmazonsGame.xml || true
          echo "--- Diagnostics: where did output go? ---"
          ls -la $HOME/natID.RAMDisk/ || true
          echo "--- Setup dir tree ---"
          find $HOME/natID.RAMDisk/Setup -maxdepth 3 2>/dev/null || echo "no Setup dir"
          echo "--- Out dir tree ---"
          find $HOME/natID.RAMDisk/Out -maxdepth 3 2>/dev/null || true
          echo "--- Setups dir ---"
          ls -la $HOME/Setups/

      - name: Stage installer output
        if: success() || failure()
        run: |
          mkdir -p ${{ github.workspace }}/installer-output
          cp -R $HOME/natID.RAMDisk/Setup/AmazonsGame/* ${{ github.workspace }}/installer-output/ 2>/dev/null || \
            echo "WARNING: nothing found in Setup/AmazonsGame - check diagnostics above"
          ls -laR ${{ github.workspace }}/installer-output/ || true

      - name: Upload installer artifact
        if: hashFiles('installer-output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AmazonsGame-macOS
          path: installer-output/*
